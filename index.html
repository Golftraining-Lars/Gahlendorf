function reportHTML(n){ const s=sh(n); if(!s) return ''; let h=''; const W=Math.max(...s.inp.map(r=>r.length),1);
  for(let r=0;r<s.inp.length;r++){ if(s.hiddenRows&&s.hiddenRows.includes(r)) continue; const cells=[]; for(let c=0;c<W;c++){ if(s.hiddenCols&&s.hiddenCols.includes(c)) continue; const t=F(n,r,c); if(t!=='') cells.push([c,t]); }
    if(!cells.length) continue; const sty=s.sty[r+',0']; const bold=sty&&S.wb.styles[sty]&&S.wb.styles[sty].b;
    if(cells.length===1&&cells[0][0]===0){ const t=cells[0][1]; h+=(bold||t.length<60)&&!/[.:]$/.test(t)&&t.length<90?`<div class="sec">${esc(t)}</div>`:`<div class="note">${esc(t)}</div>`; continue; }
    const [a,...rest]=cells; const num=rest.filter(x=>typeof V(n,r,x[0])==='number');
    h+=`<div class="row" data-act="cell" data-s="${esc(n)}" data-r="${r}" data-c="${rest.length?rest[0][0]:a[0]}"><div class="a">${a[0]===0?esc(a[1]):''}</div><div class="b">${(a[0]===0?rest:cells).map(x=>`<span class="${typeof V(n,r,x[0])==='number'&&V(n,r,x[0])<0?'neg':''}">${esc(x[1])}</span>`).join(' · ')}</div></div>`; }

VIEWS.blatt=()=>{ const n=S.sheetView; const s=sh(n); if(!s) return '<div class="empty">Blatt nicht gefunden.</div>';
  const imgs=(S.wb.images&&S.wb.images[n])||[];
  return `<div class="toolbar"><button class="btn" data-act="tab" data-t="mehr">‹ Blätter</button><b style="flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px">${esc(n)}</b></div><div class="toolbar"><input type="search" id="gq" placeholder="in diesem Blatt suchen" value="${esc(S.gridQ||'')}"></div>
   ${imgs.length?`<div class="imgs" id="imgs" data-s="${esc(n)}"></div>`:''}<div class="tablewrap" id="tw"><table class="g" id="gt"></table></div>`; };
const RH=31;
function gridAfter(){ const n=S.sheetView; const s=sh(n); const tw=$('#tw'); if(!tw) return; loadImgs(n);
  const W=Math.max(1,...s.inp.map(r=>r.length)); const cols=[]; for(let c=0;c<W;c++){ if(s.hiddenCols&&s.hiddenCols.includes(c)) continue; cols.push(c); }
  const hid=new Set(s.hiddenRows||[]); let rows=[]; for(let r=0;r<s.inp.length;r++) if(!hid.has(r)) rows.push(r);
  const q=(S.gridQ||'').toLowerCase(); if(q) rows=rows.filter(r=>r===0||cols.some(c=>F(n,r,c).toLowerCase().includes(q)));
  const width=c=>Math.max(44,Math.min(420,Math.round((s.cols[c]||80)*.9)));
  const draw=()=>{ const top=tw.scrollTop, h=tw.clientHeight||600; const i0=Math.max(0,Math.floor(top/RH)-10), i1=Math.min(rows.length,Math.ceil((top+h)/RH)+10);
    let html=`<thead><tr><th class="corner rh"></th>${cols.map(c=>`<th style="min-width:${width(c)}px;max-width:${width(c)}px">${colStr(c)}</th>`).join('')}</tr></thead><tbody>`;
    if(i0>0) html+=`<tr style="height:${i0*RH}px"><td colspan="${cols.length+1}" style="border:0;background:none"></td></tr>`;
    for(let i=i0;i<i1;i++){ const r=rows[i]; html+=`<tr><td class="rh">${r+1}</td>`;
      for(const c of cols){ const t=F(n,r,c); const f=isF(n,r,c); const st=s.sty[r+','+c]&&S.wb.styles[s.sty[r+','+c]]; const v=V(n,r,c);
        const css=(st&&st.bg?`background:${st.bg};color:${st.fg||'#222'};`:(st&&st.fg?`color:${st.fg};`:''))+(st&&st.b?'font-weight:650;':'')+(typeof v==='number'?'text-align:right;':'')+(typeof v==='number'&&v<0?'color:var(--bad);':'');
        html+=`<td class="${f?'f ':''}${s.dv[r+','+c]?'dv':''}" data-r="${r}" data-c="${c}" style="min-width:${width(c)}px;max-width:${width(c)}px;${css}" title="${esc(t.length>40?t:'')}">${esc(t)}</td>`; }
      html+='</tr>'; }
    if(i1<rows.length) html+=`<tr style="height:${(rows.length-i1)*RH}px"><td colspan="${cols.length+1}" style="border:0;background:none"></td></tr>`;
    $('#gt').innerHTML=html+'</tbody>'; };
  draw(); let raf=0; tw.onscroll=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(draw); };
  $('#gt').onclick=e=>{ const td=e.target.closest('td[data-r]'); if(td) cellDlg(n,Number(td.dataset.r),Number(td.dataset.c)); }; }
async function loadImgs(n){ const box=$('#imgs'); if(!box) return; const list=(S.wb.images&&S.wb.images[n])||[];
  for(const p of list){ let url=await IDB.get('img:'+p); if(!url&&canSync()){ try{ const r=await fetch(S.settings.url+'?fresh=1&path='+encodeURIComponent(p),{headers:hdrs()}); if(r.ok){ const b=await r.blob(); url=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); }); await IDB.set('img:'+p,url); } }catch(e){} }
    if(url&&$('#imgs')){ const im=document.createElement('img'); im.src=url; im.alt=p; im.onclick=()=>openDlg(esc(n),`<img src="${url}" style="width:100%;border-radius:8px">`); box.appendChild(im); } } }
function cellDlg(n,r,c){ const ref=colStr(c)+(r+1); const inp=I(n,r,c); const f=typeof inp==='string'&&inp[0]==='=';
  const hdr=V(n,0,c); const key=Object.prototype.hasOwnProperty.call(GKEYS,n)&&GKEYS[n]!=null?V(n,r,GKEYS[n]):null;
  const d=openDlg(`${esc(n)} · ${ref}`,`${hdr&&r>0?`<div class="small muted">${esc(hdr)}</div>`:''}<div class="kv"><div class="k">Wert</div><div class="v">${esc(F(n,r,c))||'–'}</div></div>
   ${listFor(n,r,c)?fieldFor(n,r,c,'Auswahl'):''}
   <label class="f"><span>Eingabe ${f?'(Formel – Vorsicht beim Ändern)':''}</span><textarea id="ci" style="min-height:${f?140:80}px;font-family:${f?'ui-monospace,Menlo,monospace':'inherit'};font-size:${f?12.5:15}px">${esc(inp==null?'':(typeof inp==='number'&&isDateFmt(n,r,c)?fdate(inp):(typeof inp==='string'&&inp[0]==="'"?inp.slice(1):inp)))}</textarea></label>
   <div class="small muted">Zahlen mit Komma (12,5), Datum als TT.MM.JJJJ, Formeln beginnen mit „=“ (englische Funktionsnamen, Komma als Trenner).</div>`,`<button class="btn primary" id="sv">Speichern</button>`);
  d.querySelector('#sv').onclick=async()=>{ const sel=d.querySelector('select[data-c]'); let raw=d.querySelector('#ci').value; if(sel&&sel.value!==String(V(n,r,c)??'')) raw=sel.value;
    const nv=parseInput(raw); if(sameVal(nv,inp)){ d.close(); return; } d.close(); await doOp({op:'set',sheet:n,key,r,c,input:nv}); toast('Gespeichert'); }; }
const GKEYS={'Renovierungsplan':0,'Kostenplan':0,'Wissensspeicher':0,'Kontakte':0};
function parseInput(s){ if(s==null) return null; const t=s.trim(); if(t==='') return null; if(t[0]==='=') return t;
  if(/^-?\d{1,3}(\.\d{3})*(,\d+)?$|^-?\d+(,\d+)?$/.test(t)) return Number(t.replace(/\./g,'').replace(',','.'));
  const m=t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m) return Math.round((Date.UTC(+m[3],+m[2]-1,+m[1])-Date.UTC(1899,11,30))/864e5);
  if(t[0]==="'"||t[0]==='=') return "'"+t; return s; }
/* ============================== Ereignisse ============================== */
document.addEventListener('click',async e=>{ const a=e.target.closest('[data-act]'); if(!a) return; const k=a.dataset.act;
  if(k==='close'){ $('#dlg').close(); return; }
  if(k==='done'){ e.stopPropagation(); const nr=Number(a.dataset.nr); a.style.background='var(--ok-soft)'; await setStatus(nr,'erledigt'); toast('Nr. '+nr+' erledigt'); return; }
  if(k==='task'){ e.preventDefault(); taskDlg(Number(a.dataset.nr)); return; }
  if(k==='filt'){ S.filter.a=a.dataset.k; LS.set('filter',S.filter); render(); return; }
  if(k==='kfilt'){ S.filter.k=a.dataset.k; LS.set('filter',S.filter); render(); return; }
  if(k==='kp'){ kpDlg(Number(a.dataset.r)); return; }
  if(k==='wsd'){ wsDlg(Number(a.dataset.r)); return; }
  if(k==='ws-for'){ $('#dlg').close(); newWSDlg(a.dataset.nr); return; }
  if(k==='ct'){ ctDlg(Number(a.dataset.r)); return; }
  if(k==='tab'){ e.preventDefault(); go(a.dataset.t); return; }
  if(k==='sheet'){ S.sheetView=a.dataset.s; go('blatt'); return; }
  if(k==='sheet-row'){ $('#dlg').close(); S.sheetView=a.dataset.s; S.gridQ=''; go('blatt'); setTimeout(()=>{ const tw=$('#tw'); if(tw) tw.scrollTop=Math.max(0,(Number(a.dataset.r)-2)*RH); },50); return; }
  if(k==='bericht'){ S.report=a.dataset.s; go('bericht'); return; }
  if(k==='mehr'){ const v=a.dataset.k; if(v.startsWith('blatt:')){ S.sheetView=v.slice(6); S.gridQ=''; go('blatt'); } else if(v.startsWith('bericht:')){ S.report=v.slice(8); go('bericht'); } else go(v); return; }
  if(k==='cell'){ cellDlg(a.dataset.s,Number(a.dataset.r),Number(a.dataset.c)); return; }
  if(k==='saveset'){ S.settings={url:$('#s_url').value.trim().replace(/\/+$/,''),readKey:$('#s_rk').value.trim(),writeKey:$('#s_wk').value.trim(),who:$('#s_who').value}; LS.set('settings',S.settings); toast('Gespeichert'); pull(true); return; }
  if(k==='sync'){ if(S.journal.length){ S.forcePush=true; saveNow(); } else pull(true); return; }
  if(k==='reset'){ if(S.journal.length&&!a.dataset.sure){ a.dataset.sure=1; a.textContent='Wirklich? '+S.journal.length+' ungesendete Änderungen gehen verloren'; return; } await IDB.del('wb'); await IDB.del('journal'); await IDB.del('sha'); location.reload(); return; }
  if(k==='export'){ exportXlsx(); return; }
});
document.addEventListener('input',e=>{ const id=e.target.id; const deb=(fn)=>{ clearTimeout(S._deb); S._deb=setTimeout(fn,250); };
  if(id==='q'){ S.filter.q=e.target.value; LS.set('filter',S.filter); deb(()=>{ render(); const q=$('#q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }); }
  if(id==='wq'){ S.filter.w=e.target.value; deb(()=>{ render(); const q=$('#wq'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }); }
  if(id==='cq'){ S.filter.c=e.target.value; deb(()=>{ render(); const q=$('#cq'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }); }
  if(id==='gq'){ S.gridQ=e.target.value; deb(()=>{ gridAfter(); }); }
});
document.addEventListener('change',async e=>{ if(e.target.id==='hid'){ S.showHidden=e.target.checked; render(); }
  if(e.target.id==='imp'){ const f=e.target.files[0]; if(!f) return; const wb=JSON.parse(await f.text()); S.enc=wb.schema===2?wb:WBCodec.encode(wb); setWB(WBCodec.decode(S.enc)); await IDB.set('wb',S.enc); S.journal=[]; await IDB.set('journal',[]); render(); startEngine(); toast('Arbeitsmappe geladen'); } });
$('#syncChip').onclick=()=>{ if(S.journal.length){ S.forcePush=true; saveNow(); } else pull(true); }; $('#engChip').onclick=()=>toast('Rechenkern: '+S.engine);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pull(); else if(S.dirty||S.journal.length){ S.forcePush=true; saveNow(); } });
window.addEventListener('online',()=>pull());
/* ============================== Export ============================== */
async function exportXlsx(){ if(!window.XLSX){ toast('Lade Export-Modul …'); await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='vendor/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  const wb=XLSX.utils.book_new();
  for(const s of S.wb.sheets){ const ws={}; let R=0,Cn=0; s.inp.forEach((row,r)=>row.forEach((x,c)=>{ if(x==null) return; R=Math.max(R,r); Cn=Math.max(Cn,c); const a=XLSX.utils.encode_cell({r,c}); const v=s.val[r]&&s.val[r][c];
      if(typeof x==='string'&&x[0]==='='){ const vv=v&&typeof v==='object'?null:v; ws[a]={f:x.slice(1),t:typeof vv==='number'?'n':typeof vv==='boolean'?'b':'s',v:vv==null?'':vv}; }
      else if(typeof x==='number') ws[a]={t:'n',v:x}; else if(typeof x==='boolean') ws[a]={t:'b',v:x}; else ws[a]={t:'s',v:String(x[0]==="'"?x.slice(1):x)};
      const fi=s.fmt[r+','+c]; if(fi!=null&&ws[a].t==='n') ws[a].z=S.wb.fmts[fi]; }));
    ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:R,c:Cn}}); XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31)); }
  const ver=V('Übersicht',2,1)||''; XLSX.writeFile(wb,'Fehmarn_'+ver+'_'+new Date().toISOString().slice(0,10)+'.xlsx'); }
/* ============================== Start ============================== */
async function boot(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  S.journal=(await IDB.get('journal'))||[]; S.seq=S.journal.reduce((m,o)=>Math.max(m,o.seq||0),0); S.sha=(await IDB.get('sha'))||'';
  const enc=await IDB.get('wb');
  if(enc){ S.enc=enc; setWB(WBCodec.decode(enc)); render(); startEngine(); setSync(canSync()?'…':'lokal'); pull(); }
  else if(canSync()){ await pull(true); if(!S.wb) $('#view').innerHTML='<div class="empty">Keine Daten geladen. Verbindung prüfen.</div>'+VIEWS.einst(); }
  else { S.tab='einst'; $('#view').innerHTML='<div class="banner">Willkommen. Bitte Verbindung eintragen oder eine workbook.json laden.</div>'+VIEWS.einst(); setEngine('aus'); setSync('lokal'); }
}
boot();
